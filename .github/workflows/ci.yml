name: CI

on:
  push:
    branches: [main]
  pull_request:

# The offline suite is the gate. The live smoke test is deliberately not run
# here: it spends real quota, depends on live provider data that moves hour to
# hour, and would make a deploy gate flaky. Run it by hand before publishing
# with `npm run test:live`.

jobs:
  typescript:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: typescript/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # The stdio entry point negotiates the protocol revision per connection,
      # so a regression could serve one era and silently drop the other. Both
      # are checked: the Inspector defaults to legacy, which would hide a
      # modern-era break.
      - name: Tools list over modern protocol
        run: npm run inspect:modern

      - name: Tools list over legacy protocol
        run: npm run inspect:legacy

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    strategy:
      # The floor and the ceiling. A 3.10-only syntax error or a 3.13
      # deprecation would otherwise surface as a user's install failure.
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Lint
        run: uvx ruff check src tests scripts

      - name: Test
        run: uv run --python ${{ matrix.python-version }} pytest

      # The parity suite proves the two packages agree with each other, which
      # is not the same as agreeing with the API: carClass shipped as a list
      # in both languages for an enum the API takes singly, so the parameter
      # was impossible to use and both packages were consistently wrong. This
      # reads the published OpenAPI spec and compares shapes. It needs network
      # but no key, and a spec fetch failure should not fail a PR, so it is
      # advisory on one Python version only.
      - name: Check tool schemas against the published OpenAPI spec
        if: matrix.python-version == '3.13'
        continue-on-error: true
        env:
          KTEMIA_CONTRACT_TEST: '1'
        run: uv run --python 3.13 pytest tests/test_contract.py -v

      # The wheel is what users actually get. A missing tools.json here is a
      # server that cannot start, and it would not show up in the tests above,
      # which read the file from the source tree.
      - name: Build and verify the wheel runs standalone
        run: |
          uv build
          uv run --isolated --no-project --with dist/*.whl \
            python scripts/smoke_wheel.py

  # Both packages read spec/tools.json, so a change to one package's prose
  # without the other is the failure mode this repo is structured to prevent.
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: typescript/package-lock.json

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Build the TypeScript package
        working-directory: typescript
        run: npm ci && npm run build

      - name: Assert both packages ship the same contract
        working-directory: python
        run: uv run pytest tests/test_parity.py -v
