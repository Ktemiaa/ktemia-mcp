name: Publish

# Releases are cut by pushing a version tag, so the published artifact is
# always traceable to a commit:
#
#   git tag -a v0.1.1 -m "v0.1.1" && git push origin v0.1.1
#
# Authentication is npm trusted publishing over OIDC. There is no npm token in
# this repo or in GitHub secrets: npm verifies the workflow identity instead,
# which is why `id-token: write` below is load-bearing. Removing it turns every
# release into an ENEEDAUTH failure.
#
# Publishing from a public repo this way also makes npm attach a provenance
# attestation automatically, so `--provenance` is deliberately absent.

on:
  push:
    tags: ["v*"]

jobs:
  npm:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC: how npm authenticates this workflow
      contents: read
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v4

      # No dependency cache: a release build should resolve from the lockfile
      # rather than trust a cache that a previous run populated.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1. Node 24 ships a new enough npm
      # today, but pinning the floor here means a runner image change cannot
      # quietly drop OIDC support and fall back to asking for a token.
      - name: Ensure npm supports OIDC
        run: npm install -g npm@latest

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # The tag says what to publish, but nothing has verified this commit yet
      # if the tag was pushed without a prior CI run on main. Re-run the gate.
      - name: Test
        run: npm test

      - name: Assert the tag matches the package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p 'require("./package.json").version')"
          if [ "$tag" != "$pkg" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json $pkg" >&2
            exit 1
          fi

      - name: Publish
        run: npm publish --access public

  # PyPI trusted publishing, the same idea as npm above: PyPI trusts this
  # repo + workflow file + environment, so there is no PyPI token anywhere.
  # The publisher is registered on pypi.org under the Ktemia organization;
  # renaming this file or the environment breaks it until that is updated.
  pypi:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/ktemia-mcp/
    permissions:
      id-token: write # OIDC: how PyPI authenticates this workflow
      contents: read
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Lint
        run: uvx ruff check src tests scripts

      - name: Test
        run: uv run pytest

      - name: Assert the tag matches the package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -1)"
          if [ "$tag" != "$pkg" ]; then
            echo "tag $GITHUB_REF_NAME does not match pyproject.toml $pkg" >&2
            exit 1
          fi

      - name: Build
        run: uv build

      # The packaged tools.json is a separate build step; without it the
      # server starts with no tools. Prove the exact artifact about to be
      # uploaded serves all seven before PyPI makes it permanent.
      - name: Verify the wheel runs standalone
        run: |
          uv run --isolated --no-project --with dist/*.whl \
            python scripts/smoke_wheel.py

      # The pypa action also uploads PEP 740 attestations, PyPI's equivalent
      # of npm provenance. It is a container action, so the job's
      # working-directory does not apply and the path is spelled out.
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist

  # Lists the release in the official MCP Registry
  # (registry.modelcontextprotocol.io) as io.github.Ktemiaa/ktemia-mcp.
  # The registry stores metadata only and verifies it against the packages it
  # names, so this runs after both are published. Authentication is GitHub
  # OIDC, the same as npm and PyPI: no token. OIDC is also the only login that
  # can publish under an organization namespace; the interactive device login
  # cannot read org roles and gets a 403.
  registry:
    needs: [npm, pypi]
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC: how the MCP Registry authenticates this workflow
      contents: read
    env:
      # Pinned and signature-checked. Bump deliberately, never to "latest".
      MCP_PUBLISHER_VERSION: v1.8.9
    steps:
      - uses: actions/checkout@v4

      - name: Assert the tag matches server.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          versions="$(jq -r '.version, .packages[].version' server.json | sort -u)"
          if [ "$versions" != "$tag" ]; then
            echo "tag $GITHUB_REF_NAME does not match server.json: $versions" >&2
            exit 1
          fi

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error -o "$archive" "$base/$archive"
          curl --fail --location --silent --show-error -o "$archive.sigstore.json" "$base/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher

      - name: Authenticate to the MCP Registry
        run: ./mcp-publisher login github-oidc

      # The registry checks the new version on npm and PyPI, and both can take
      # a few minutes to serve it after upload. Retry instead of failing the
      # release on propagation lag.
      - name: Publish to the MCP Registry
        run: |
          for attempt in 1 2 3 4 5 6; do
            ./mcp-publisher publish && exit 0
            echo "attempt $attempt failed; retrying in 60s" >&2
            sleep 60
          done
          exit 1
